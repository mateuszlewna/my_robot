ekf_filter_node:
    ros__parameters:
        # Źródło danych z kół (odom)
        odom0: "odom" 
        odom0_config: [true, true, false,  # x, y - pozycja jest wiarygodna
                       false, false, true,  # roll, pitch, yaw - orientacja jest wiarygodna
                       true, true, false,  # x_vel, y_vel - prędkość liniowa jest wiarygodna
                       false, false, true,  # roll_vel, pitch_vel, yaw_vel - prędkość kątowa jest wiarygodna
                       false, false, false]
        odom0_differential: false 

        # Źródło danych z akcelerometru (imu)
        imu0: "imu/data_raw"
        imu0_config: [false, false, false,  # x, y, z - pozycja
                      false, false, false,  # roll, pitch, yaw - orientacja
                      false, false, false,  # x_vel, y_vel, z_vel - prędkość liniowa
                      false, false, false,  # roll_vel, pitch_vel, yaw_vel - prędkość kątowa
                      true, true, true]  # x_accel, y_accel, z_accel - przyspieszenie jest wiarygodne
        imu0_differential: false

        # Ramki odniesienia
        world_frame: "odom"
        odom_frame: "odom"
        base_link_frame: "base_link"