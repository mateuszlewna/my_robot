/**:
  ros__parameters:
    slam_toolbox:
      # Ustawienie zakresu lidaru
      laser_min_range: 0.2
      laser_max_range: 16.0

      # PARAMETRY ODOMETRII
      odom_topic: "/odom" 
      use_odometry: true 

      # Inne ogólne parametry
      map_update_interval: 0.5
      resolution: 0.05
      base_frame: "base_link"
      odom_frame: "odom"
      map_frame: "map"
      laser_queue_size: 50
      transform_timeout: 0.2 