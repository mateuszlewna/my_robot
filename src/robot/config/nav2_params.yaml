nav2_params:
  ros__parameters:
    use_sim_time: false

    planner_server:
      ros__parameters:
        planner_plugins: ["GridBased"]
        GridBased:
          plugin: "nav2_navfn_planner/NavfnPlanner"

    controller_server:
      ros__parameters:
        controller_frequency: 20.0
        controller_plugins: ["FollowPath"]

        FollowPath:
          plugin: "dwb_core::DWBLocalPlanner"
          critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist"]

          RotateToGoal:
            scale: 32.0
          Oscillation:
            scale: 0.1
            threshold: 0.2
          BaseObstacle:
            scale: 0.02
            max_scaling_factor: 0.6
          GoalAlign:
            scale: 24.0
          PathAlign:
            scale: 12.0
          PathDist:
            scale: 32.0
            distance_begin: 0.0
            distance_end: 0.15

    bt_navigator:
      ros__parameters:
        bt_xml_filename: "/home/mateusz/my_robot/src/robot/config/navigation_tree.xml"

    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: base_link
        rolling_window: false
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan
            obstacle_range: 2.5
            raytrace_range: 3.0
            max_obstacle_height: 0.4
            clearing: true
            marking: true

    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: odom
        robot_base_frame: base_link
        rolling_window: true
        width: 3.0
        height: 3.0
        resolution: 0.05
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan
            obstacle_range: 2.5
            raytrace_range: 3.0
            max_obstacle_height: 0.4
            clearing: true
            marking: true
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
