slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    
    mode: mapping  # Tryb mapowania

    # Logowanie i podstawowe ustawienia
    debug_logging: true  # Włączone dla debugowania problemów
    throttle_scans: 1
    transform_publish_period: 0.05  # Zwiększono do 0.05 s (20 Hz) dla mniejszego obciążenia
    map_update_interval: 1.0  # Zmniejszono do 1.0 s dla płynniejszej aktualizacji w RViz
    resolution: 0.05
    
    # Parametry sensora - dopasowane do RPLIDAR A2
    min_laser_range: 0.3  # Zwiększono, aby odfiltrować szumy bliżej sensora
    max_laser_range: 16.0  # Zmniejszono dla RPLIDAR A2 (dla A3 ustaw 25.0)

    # Parametry synchronizacji i buforów
    minimum_time_interval: 0.1  # Zmniejszono dla szybszej reakcji na ruch
    transform_timeout: 1.0
    tf_buffer_duration: 20.0  # Zmniejszono dla szybszego zarządzania buforem

    # Parametry dopasowania skanów
    use_scan_matching: true 
    use_scan_barycenter: true
    minimum_travel_distance: 0.1  # Zmniejszono dla częstszych aktualizacji pozycji
    minimum_travel_heading: 0.087  # ~5 stopni, dla większej czułości na rotację
    scan_buffer_size: 20  # Zwiększono dla lepszej korelacji w dynamicznych środowiskach
    scan_buffer_maximum_scan_distance: 12.0  # Dopasowano do max_laser_range
    
    # Parametry zamykania pętli
    do_loop_closing: true
    loop_search_maximum_distance: 12.0  # Zwiększono dla większych przestrzeni
    link_match_minimum_response_fine: 0.2  # Zwiększono dla bardziej rygorystycznego dopasowania
    link_scan_maximum_distance: 2.0  # Zwiększono dla większej tolerancji
    loop_match_minimum_chain_size: 8  # Zmniejszono dla szybszego wykrywania pętli
    loop_match_minimum_response_coarse: 0.4  # Nieco zwiększono dla stabilności
    loop_match_minimum_response_fine: 0.5  # Zwiększono dla dokładniejszego zamykania pętli
    
    # Pozostałe parametry
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 10.0  # Zwiększono dla większych przestrzeni
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.1  # Zmniejszono dla mniejszej kary za odległość
    angle_variance_penalty: 0.3  # Zmniejszono dla mniejszej kary za kąt
    fine_search_angle_offset: 0.00174
    coarse_search_angle_offset: 0.1745
    coarse_angle_resolution: 0.01745
    minimum_angle_penalty: 0.95
    minimum_distance_penalty: 0.8
    use_response_expansion: true