slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping  # <-- KRYTYCZNE: Zmienione na 'mapping' do tworzenia mapy

    # Logowanie i podstawowe ustawienia
    debug_logging: false
    throttle_scans: 2
    transform_publish_period: 0.02
    map_update_interval: 0.5      # <-- ZMNIEJSZONO: Częstsza aktualizacja mapy w RViz
    resolution: 0.05
    
    # Parametry sensora - dopasowane do Twojego sprzętu
    laser_min_range: 0.2          # <-- DODANO: Zgodnie z ostrzeżeniem z poprzedniego logu
    max_laser_range: 16.0         # <-- ZMIENIONO: Zgodnie z ostrzeżeniem z poprzedniego logu

    # Parametry synchronizacji i buforów
    minimum_time_interval: 0.1   # <-- ZMNIEJSZONO: Szybsza reakcja na ruch
    transform_timeout: 1.0        # <-- KRYTYCZNIE ZWIĘKSZONO: Daje więcej czasu na znalezienie transformacji
    tf_buffer_duration: 30.0      # Bufor 30 sekund jest OK

    # Parametry dopasowania skanów
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.17 # ok. 10 stopni
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    
    # Parametry zamykania pętli
    do_loop_closing: true
    loop_search_maximum_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    
    # Pozostałe parametry mogą na razie zostać domyślne
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true